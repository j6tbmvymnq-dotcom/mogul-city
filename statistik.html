<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mogul City Statistik</title>
<style>
  :root { --bg: #f4f2ec; --card: #fff; --ink: #1d2b44; --mute: #66738a; --line: #e6e2d8; --bar: #2b7de9; --gold: #d99a12; --red: #d93025; --green: #22a455; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111a2b; --card: #1a263c; --ink: #e8edf6; --mute: #93a0b8; --line: #2a3853; --bar: #5b9dff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 26px 0 10px; }
  .mute { color: var(--mute); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; } .tile span { color: var(--mute); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .bar { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 70px; gap: 10px; align-items: center; padding: 4px 0; font-size: 14px; }
  .bar span { overflow-wrap: anywhere; }
  .bar i { display: block; height: 12px; border-radius: 6px; background: var(--bar); min-width: 2px; }
  .bar em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--mute); }
  .bar.sep { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; white-space: nowrap; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); } th { color: var(--mute); font-weight: 600; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; border-radius: 6px; padding: 1px 6px; font-size: 12px; background: var(--line); }
  .tag.ok { background: rgba(34, 164, 85, .18); color: var(--green); } .tag.warn { background: rgba(217, 154, 18, .2); color: var(--gold); }
  form { display: flex; gap: 8px; margin-top: 14px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button { font: inherit; font-weight: 700; padding: 10px 16px; border: 0; border-radius: 10px; background: var(--bar); color: #fff; }
  .err { color: var(--red); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Mogul City Statistik</h1>
  <div class="mute" id="sub">Nutzung pro Stadt aus der Testphase</div>
  <form id="f"><input id="pin" type="password" placeholder="PIN" autocomplete="current-password"><button>Anzeigen</button></form>
  <label class="mute" style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="tst" style="flex:none"> Teststädte mitzählen</label>
  <div class="err" id="err"></div>
  <div id="out"></div>
</main>
<script src="js/config.js"></script>
<script>
(function () {
  'use strict';
  var cfg = (window.MC_CONFIG || {}).cloud || {}, $ = function (id) { return document.getElementById(id); };
  var NAMES = { name_frage: 'Namensfrage gesehen', name: 'Stadt benannt', anleitung: 'Home-Bildschirm-Anleitung', app: 'App vom Home-Bildschirm gestartet',
    browser: 'Spielt im Browser (Ausweg)', tut_1: 'Tutorial Schritt 1', tut_3: 'Tutorial Schritt 3', tut_5: 'Tutorial Schritt 5', tut_8: 'Tutorial Schritt 8',
    tut_fertig: 'Tutorial geschafft', level_3: 'Level 3', level_5: 'Level 5', level_7: 'Level 7', level_10: 'Level 10', level_15: 'Level 15', level_20: 'Level 20',
    ziel_5: '5 Ziele', ziel_10: '10 Ziele', ziel_15: '15 Ziele', ziel_20: '20 Ziele', land_2: '1. Grundstück gekauft', land_3: '2. Grundstück gekauft' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ago(t) {
    var m = Math.round((Date.now() - new Date(t)) / 60000);
    return m < 2 ? 'gerade' : m < 60 ? 'vor ' + m + ' Min.' : m < 1440 ? 'vor ' + Math.round(m / 60) + ' Std.' : 'vor ' + Math.round(m / 1440) + ' Tg.';
  }
  function label(k) {
    if (!k) return '';
    if (NAMES[k]) return NAMES[k];
    var m = /^(\w+?)_(.*)$/.exec(k);
    return m ? ({ sitzung: 'Sitzung (Level ', level: 'Level ', ziel: 'Ziel ', land: 'Grundstück ', tut: 'Tutorial ', fehler: 'Fehler: ' }[m[1]] || m[1] + ' ') + m[2] + (m[1] === 'sitzung' ? ')' : '') : k;
  }
  function bars(list, total, sepAt) {
    var max = Math.max.apply(null, list.map(function (x) { return x.n; }).concat([1]));
    return '<div class="card">' + list.map(function (x, i) {
      var pct = total ? Math.round(100 * x.n / total) + ' %' : '';
      return '<div class="bar' + (sepAt && sepAt.indexOf(x.k) >= 0 ? ' sep' : '') + '"><span>' + esc(NAMES[x.k] || x.k || 'unbekannt') + '</span><i style="width:' + (100 * x.n / max) + '%"></i><em>' + x.n + (pct ? ' · ' + pct : '') + '</em></div>';
    }).join('') + '</div>';
  }
  function render(d) {
    var h = '<div class="tiles">' + [['spieler', 'Städte gesamt'], ['neu_24h', 'neu (24 Std.)'], ['aktiv_24h', 'aktiv (24 Std.)'], ['aktiv_7d', 'aktiv (7 Tage)'], ['wiederkehrer', 'an 2+ Tagen gespielt']]
      .map(function (t) { return '<div class="tile"><b>' + (d[t[0]] || 0) + '</b><span>' + t[1] + '</span></div>'; }).join('') + '</div>';
    var tr = d.trichter || [], first = (tr.filter(function (x) { return x.k === 'name_frage'; })[0] || {}).n || d.spieler;
    h += '<h2>Trichter: Wie weit kommen die Spieler?</h2><div class="mute" style="margin-bottom:8px">Prozent bezogen auf alle, die die Namensfrage gesehen haben. Ein starker Abfall zeigt, wo es hakt.</div>' +
      bars(tr, first, ['tut_1', 'level_3', 'ziel_5', 'land_2']);
    h += '<h2>Geräte</h2>' + bars(d.geraete || [], d.spieler);
    if (d.tage && d.tage.length) h += '<h2>Letzte 14 Tage</h2><div class="card scroll"><table><tr><th>Tag</th><th>Städte aktiv</th><th>davon neu</th></tr>' +
      d.tage.map(function (t) { return '<tr><td>' + new Date(t.k).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }) + '</td><td class="n">' + t.spieler + '</td><td class="n">' + t.neu + '</td></tr>'; }).join('') + '</table></div>';
    h += '<h2>Fehler im Spiel</h2>' + (d.fehler && d.fehler.length ? '<div class="card scroll"><table><tr><th>Meldung</th><th>Anzahl</th><th>Städte</th></tr>' +
      d.fehler.map(function (f) { return '<tr><td>' + esc(f.k) + '</td><td class="n">' + f.n + '</td><td class="n">' + f.staedte + '</td></tr>'; }).join('') + '</table></div>' : '<div class="card mute">Keine Fehler gemeldet.</div>');
    h += '<h2>Alle Städte</h2><div class="card scroll"><table><tr><th>Stadt</th><th>Level</th><th>Ziel</th><th>Tutorial</th><th>Sitzungen</th><th>Tage</th><th>Gerät</th><th>Seit</th><th>Zuletzt</th><th>Letztes Ereignis</th></tr>' +
      (d.staedte || []).map(function (s) {
        var tut = s.tut === 'done' ? '<span class="tag ok">fertig</span>' : s.tut == null ? '' : '<span class="tag warn">Schritt ' + (+s.tut + 1) + '</span>';
        var via = s.app ? ' <span class="tag ok">App</span>' : s.browser ? ' <span class="tag warn">Browser</span>' : ' <span class="tag">nicht installiert</span>';
        return '<tr><td><b>' + esc(s.name) + '</b>' + (s.test ? ' <span class="tag">Test</span>' : '') + via + '</td><td class="n">' + (s.lvl || '') + '</td><td class="n">' + (s.ziel == null ? '' : s.ziel) + '</td><td>' + tut + '</td><td class="n">' + s.sitzungen + '</td><td class="n">' + s.tage +
          '</td><td>' + esc(s.geraet) + '</td><td>' + ago(s.erst) + '</td><td>' + ago(s.zuletzt) + '</td><td>' + esc(label(s.letztes)) + '</td></tr>';
      }).join('') + '</table></div>';
    $('out').innerHTML = h;
    $('sub').textContent = 'Stand ' + new Date(d.stand).toLocaleString('de-DE') + ' · ' + (d.teststaedte || 0) + ' Teststädte ' + ($('tst').checked ? 'mitgezählt' : 'ausgeblendet');
  }
  function load(pin) {
    $('err').textContent = '';
    fetch(cfg.url.replace(/\/$/, '') + '/rest/v1/rpc/mc_stats', { method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: cfg.key, Authorization: 'Bearer ' + cfg.key }, body: JSON.stringify({ p_pin: pin, p_test: $('tst').checked }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || ('HTTP ' + r.status)); return j; }); })
      .then(function (d) { try { localStorage.setItem('mc.statpin', pin); } catch (e) { } $('f').style.display = 'none'; render(d); })
      .catch(function (e) { $('err').textContent = /PIN/.test(e.message) ? 'Falsche PIN.' : /mc_stats|function/.test(e.message) ? 'Schritt 3 (SQL) ist noch nicht eingerichtet.' : 'Fehler: ' + e.message; });
  }
  $('tst').onchange = function () { var p = saved || $('pin').value.trim(); if (p) load(p); };
  $('f').onsubmit = function (e) { e.preventDefault(); load($('pin').value.trim()); };
  var saved = ''; try { saved = localStorage.getItem('mc.statpin') || ''; } catch (e) { }
  if (saved) load(saved);
  setInterval(function () { if ($('f').style.display === 'none' && !document.hidden) load(saved || $('pin').value.trim()); }, 60000);
})();
</script>
</body>
</html>
