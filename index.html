<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mogul City</title>
<meta name="theme-color" content="#16233b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mogul City">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="map"></canvas>
<div id="splash"><img src="icons/icon-192.png" alt=""><h1>Mogul City</h1><div class="lbar"><i id="lfill"></i></div><p id="ltext">Stadt wird geladen …</p></div>

<div id="topbar"></div>
<div id="hud">
  <button id="lvlBox" class="pill" aria-label="Firmenübersicht">
    <span id="lvl" class="lvl">1</span>
    <span class="lvlinfo"><span id="city" class="city">Meine Stadt</span><span class="xpbar"><i id="xpfill"></i></span></span>
    <span id="nextIc" class="nextic" hidden></span>
  </button>
  <div class="pill money"><span class="ic coin"></span><b id="cash">0</b></div>
  <div class="pill money"><span class="ic gold"></span><b id="gold">0</b></div>
  <button id="worthBox" class="pill money worth" aria-label="Bestenliste"><span class="ic worthic"></span><b id="worth">0</b></button>
  <button id="menuBtn" class="pill iconbtn" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>

<div id="visitBar" hidden><span id="visitText"></span><button id="visitBack">Zurück nach Hause</button></div>
<button id="goal" hidden aria-label="Aktuelles Ziel"><span class="gic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></span><span class="gt"><b id="goalT"></b><span class="grow"><span class="gbar"><i id="goalFill"></i></span><span id="goalN"></span></span></span></button>
<button id="moonBtn" class="pill" hidden aria-label="Zum Mond"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><b>Mond</b></button>
<button id="flatBtn" class="pill" hidden aria-label="Ansicht wechseln"><b id="flatTxt">2D</b></button>
<div id="banner" hidden><span id="bannerText"></span><button id="bannerDone">Fertig</button></div>

<div id="bar">
  <button data-act="build" data-grp="main"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Bauen</span></button>
  <button data-act="missions" data-grp="main"><svg viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/></svg><span>Ziele</span><i id="missionDot" class="dot" hidden></i></button>
  <button data-act="lease" data-grp="main" hidden><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 11.5h6M9 15h6M9 18.5h3.5"/></svg><span>Vermieten</span></button>
  <button data-act="collect" data-grp="main" class="gold"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-1-1.4-1.4-2.6-1.4-1.5 0-2.5.8-2.5 2 0 2.9 5.3 1.4 5.3 4.3 0 1.3-1.1 2.1-2.7 2.1-1.3 0-2.3-.5-2.8-1.6M12 6v12"/></svg><span>Kassieren</span><i id="collectBadge" class="badge" hidden>0</i></button>
  <button data-act="shop" data-grp="bau"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Gebäude</span></button>
  <button data-act="road" data-grp="bau"><svg viewBox="0 0 24 24"><path d="M8 3L4 21M16 3l4 18"/><path d="M12 4v3M12 10.5v3M12 17v3"/></svg><span>Straße</span></button>
  <button data-act="flat" data-grp="bau"><b class="flattxt" id="barFlat">2D</b><span>Ansicht</span></button>
  <button data-act="done" data-grp="bau"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Fertig</span></button>
</div>

<div id="placebar" hidden>
  <button id="placeCancel" class="btn ghost">Abbrechen</button>
  <button id="placeOk" class="btn primary">Bauen</button>
</div>

<div id="sheet" hidden>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="sheetBody" class="sheet-body"></div>
</div>

<div id="advisor" hidden></div>
<div id="tutBox" hidden></div>
<div id="finger" hidden></div>
<div id="modal" hidden><div id="modalCard" class="card"></div></div>
<div id="toasts"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/mond.js"></script>
<script src="js/cloud.js"></script>
<script src="js/assets.js"></script>
<script src="js/art.js"></script>
<script src="js/view.js"></script>
<script src="js/install.js"></script>
<script src="js/ui.js"></script>
<script src="js/mondui.js"></script>
<script src="js/tutorial.js"></script>
</body>
</html>
